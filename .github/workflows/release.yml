name: Release

# Publishes Taurus.app as a .dmg and a .zip on the Releases page, versioned by
# the tag. Either push a tag:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# or run this workflow from the Actions tab with a version number, which
# creates the tag on the chosen branch. Tags with a suffix (v0.2.0-beta.1)
# become pre-releases.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (becomes tag v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  macos:
    name: Release ${{ github.event.inputs.version || github.ref_name }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          RAW="${INPUT:-$GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a version like 0.2.0 or v0.2.0-beta.1"
            exit 1
          fi
          if [ -n "$INPUT" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version, or re-run the job of that tag."
            exit 1
          fi
          PRE=false
          [[ "$VERSION" == *-* ]] && PRE=true
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (pre-release: $PRE)"

      - name: Stamp the version into Cargo.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml

      # screencapturekit's Metal bridge uses APIs from the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked

      # Only builds made here install new releases by themselves.
      - name: Bundle
        env:
          TAURUS_RELEASE: "1"
        run: cargo bundle --release

      - name: Sign and package
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP=target/release/bundle/osx/Taurus.app
          NAME="Taurus-$TAG-macos-arm64"
          SHOWN=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          if [ "$SHOWN" != "$VERSION" ]; then
            echo "::error::The app says $SHOWN, expected $VERSION"
            exit 1
          fi
          # Not notarised: an ad-hoc signature lets it run once the user allows it.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/$NAME.zip"
          hdiutil create -volname "Taurus $VERSION" -srcfolder "$APP" -ov -format UDZO "dist/$NAME.dmg"
          (cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Taurus-${{ steps.version.outputs.tag }}-macos-arm64
          path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Taurus ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
